name: Deploy to Server

# Fires when the "Rust code quality" workflow passes on master: build the
# Docker image on the runner, push it to Docker Hub tagged with the commit
# short SHA (plus `latest`), then run .github/deploy.sh on gunlinux.ru over
# SSH, which pulls that tag and restarts the unit.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN and PRIVATE_KEY_SSH (an SSH key
# authorized for loki@gunlinux.ru).

on:
  workflow_run:
    workflows: ["Rust code quality"]
    branches: [master]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: gunlinuxloki/beerstat

jobs:
  build-and-deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute image tag
        id: tag
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha7=${RUN_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha7 }}
            ${{ env.IMAGE }}:latest

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY_SSH }}

      # Port 187 is the server's non-standard SSH port. deploy.sh pulls the
      # pushed tag before installing the unit.
      - name: Deploy to server
        env:
          DEPLOY_TAG: ${{ steps.tag.outputs.sha7 }}
        run: |
          ssh -o StrictHostKeyChecking=no -p 187 "loki@gunlinux.ru" \
            "DEPLOY_TAG=$DEPLOY_TAG bash -s" < .github/deploy.sh
